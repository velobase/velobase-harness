packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# Keep optional SDK peers in the hosts that actually install them.
resolvePeersFromWorkspaceRoot: false
dedupePeerDependents: false

onlyBuiltDependencies:
  - electron
  - sharp

overrides:
  # Pin compatible fixes for the Expo 57 toolchain and backend dependencies; see
  # docs/en/ai/ci-dependency-security.md for the audited local patches.
  # Retain the original Expo tooling fixes for their
  # locked CLI dependencies (GHSA-c2c7-rcm5-vvqj, GHSA-5p4m-2wfm-xmqj).
  "jest-util@29.7.0>picomatch": 2.3.2
  "micromatch@4.0.8>picomatch": 2.3.2
  "@expo/xcpretty@4.4.4>js-yaml": 4.3.2
  "@grpc/grpc-js@>=1.14.0 <1.14.5": 1.14.5
  "ajv@>=8.0.0 <8.18.0": 8.20.0
  "axios@>=1.0.0 <1.20.0": 1.20.0
  "body-parser@>=2.0.0 <2.3.0": 2.3.0
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "bullmq>uuid": 11.1.1
  "deepmerge-ts@<8.0.0": 8.0.0
  "defu@<=6.1.4": 6.1.5
  "dompurify@<3.4.14": 3.4.14
  "effect@<3.20.0": 3.20.0
  "fast-uri@>=3.0.0 <3.1.7": 3.1.7
  "form-data@>=4.0.0 <4.0.6": 4.0.6
  "minimatch@>=9.0.0 <9.0.7": 9.0.7
  "nanoid@>=3.0.0 <3.3.18": 3.3.18
