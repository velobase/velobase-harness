packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# Keep optional SDK peers in the hosts that actually install them.
resolvePeersFromWorkspaceRoot: false
dedupePeerDependents: false

onlyBuiltDependencies:
  - electron
  - sharp

overrides:
  # Expo 57.0.20 / CLI 57.0.22 are current. Pin compatible patches for their
  # locked CLI dependencies (GHSA-c2c7-rcm5-vvqj, GHSA-5p4m-2wfm-xmqj).
  "jest-util@29.7.0>picomatch": 2.3.2
